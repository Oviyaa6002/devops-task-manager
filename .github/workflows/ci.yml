name: DevOps Task Manager CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Flask App
        run: |
          python -m py_compile backend/app.py
          python -m py_compile backend/database.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager-backend:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager-backend:latest

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/flask-deployment flask=oviyaa2006/devops-task-manager-backend:latest

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/flask-deployment
